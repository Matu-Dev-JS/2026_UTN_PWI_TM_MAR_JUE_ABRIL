<!-- Comentario: CODIGO QUE EL NAVEGADOR NO INTERPRETA -->
<!-- Para comentar usamos ALT + SHIFT + A -->

<!-- SEO Search Engine Optimization = Optimizacion para motores de busqueda -->

<!DOCTYPE html><!-- Tipo de documento es HTML -->
<html lang="es"><!-- Marca el inicio del HTML y tiene el atributo lang que informa el lenguaje en el que esta escrito la pagina. NO TRADUCE, sino mas bien informa al navegador en que lenguaje se escribio -->
<head><!-- Configuracion de la pagina, generalmente cosas para el navegador -->
    <meta charset="UTF-8"><!-- Codificacion de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- El ancho del viewport sera igual al ancho del dispositivo con el que se entre a la pagina. NO HACE QUE TU PAGINA SE VEA BIEN EN ESE ANCHO, simplemente es que se adapte -->
    <meta name="description" content="Aprende a hacer las mejores empanadas caseras.">
    <meta name="keywords" content="Empanadas, Empanadas, Empanadas Caseras, Empanadas Argentinas">
    <title>Paulina cocina</title><!-- Es el titulo del documento -->
</head>

    <!-- h1 ... h6: Sirven para textos con Jerarquia -->
